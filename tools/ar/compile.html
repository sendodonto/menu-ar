<!doctype html><meta charset="utf-8"><title>compile target</title>
<script type="module">
  import { Compiler } from '/node_modules/mind-ar/dist/mindar-image.prod.js';
  window.compileTarget = async (src) => {
    const img = new Image(); img.src = src; await img.decode();
    const c = new Compiler();
    await c.compileImageTargets([img], () => {});
    const bytes = new Uint8Array(await c.exportData());
    let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.ready = true;
</script>
